name: "📝 Conteúdo (cheat sheet)"
description: Adicionar uma tecnologia, corrigir um comando ou sugerir novos comandos.
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Valeu por melhorar o conteúdo! 💡 **Quer adicionar um comando ou uma sheet?** O
        [editor web](https://gugupx.github.io/Dev-sheets-Wallpaper/editor/) gera o arquivo pronto e abre o Pull Request para você — sem
        git e sem JSON. Esta issue serve para correções e sugestões que você não quer
        escrever. Formato completo no
        [CONTENT_GUIDE](https://github.com/GuguPx/Dev-sheets-Wallpaper/blob/main/CONTENT_GUIDE.md).
  - type: dropdown
    id: kind
    attributes:
      label: Tipo
      options:
        - Corrigir um comando existente (errado/desatualizado)
        - Adicionar comandos a uma tecnologia que já existe
        - Adicionar uma tecnologia nova
    validations:
      required: true
  - type: input
    id: tech
    attributes:
      label: Tecnologia
      description: Ex.- git, docker, "GitHub Actions" (uma nova)
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Detalhes
      description: Quais comandos, o que está errado, ou o que deveria ser adicionado.
      placeholder: |
        Ex.: `git restore --staged` está descrito como destrutivo, mas não é.
        Ex.: faltam os comandos de stash (git stash push/pop/list).
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Fonte oficial
      description: Link da documentação que embasa o conteúdo (não inventamos comandos).
    validations:
      required: true
